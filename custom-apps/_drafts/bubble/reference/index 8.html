      <button class="sh-item" id="ex-json"><svg viewBox="0 0 24 24"><path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/><path d="M2 12h11l-3-3M10 15l3-3"/></svg>备份 .json（以后能导回来）</button>
      <button class="sh-item" onclick="closeAll()">取消</button>`);
    $('#ex-txt').onclick=()=>{closeAll();
      saveFile('bubble-全部-'+stamp()+'.txt',ids.map(toText).join('\n\n'+'═'.repeat(24)+'\n\n'),'text/plain')};
    $('#ex-json').onclick=()=>{closeAll();
      saveFile('bubble-全部-'+stamp()+'.json',JSON.stringify(packRooms(ids),null,1),'application/json')};
  };
  $('#m-in').onclick=importBackup;
  $('#m-refresh').onclick=async e=>{e.target.textContent='…';await loadChars();renderHome();openMy();snack('已刷新')};
  $('#m-read').onclick=()=>{chars.forEach(c=>{if(rooms[c.id]?.unread){rooms[c.id].unread=0;persist(c.id)}});
    renderHome();openMy();snack('都已读了')};
  $('#m-wipe').onclick=()=>openSheet(`<div class="sh-title">所有角色的泡泡记录都会被清掉，不能撤销。</div>
    <button class="sh-item red" onclick="wipeAll()">确认清空</button>
    <button class="sh-item" onclick="closeAll()">取消</button>`);
  if(stack[stack.length-1]!=='v-my')go('v-my');else closeAll();
}
function wipeAll(){
  chars.forEach(c=>{const r=rooms[c.id];if(!r)return;
    r.msgs.forEach(dropMedia);
    r.msgs=[];r.unread=0;persist(c.id)});
  closeAll();renderHome();openMy();snack('已清空');
}

/* ==================== 导出 / 导入 ==================== */
async function saveFile(name,text,mime){
  const dataUrl='data:'+mime+';charset=utf-8,'+encodeURIComponent(text);
  if(HOST&&HOST.media&&HOST.media.save){
    try{await HOST.media.save({dataUrl,type:'custom_app_media',filename:name});return snack('已保存到相册／文件')}catch(e){}
  }
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);snack('已导出 '+name);
  }catch(e){snack('这个环境没法保存文件')}
}
function packRooms(ids){
  return{app:'bubble',version:1,exportedAt:new Date().toISOString(),
    me:{nick:me.nick||''},
    rooms:ids.filter(id=>rooms[id]).map(id=>{const r=rooms[id];
      return{charId:id,charName:(getChar(id)||{}).name||'',theme:r.theme,since:r.since,sub:!!r.sub,
        rel:r.rel,open:r.open,know:r.know,extra:r.extra,auto:r.auto,
        inviteState:r.inviteState||'',inviteAtCount:r.inviteAtCount||0,
        msgs:(r.msgs||[]).map(m=>({...m,pending:undefined}))}})};
}
function toText(id){
  const r=rooms[id],c=getChar(id)||{name:'未知'},L=[];
  L.push(c.name+' · bubble 记录');
  L.push('导出于 '+new Date().toLocaleString('zh-CN'));
  L.push('共 '+(r.msgs||[]).length+' 条');
  L.push('─'.repeat(24));
  let day='';
  for(const m of r.msgs||[]){
    const d=new Date(m.ts).toDateString();
    if(d!==day){day=d;L.push('');L.push('【'+fmtDay(m.ts)+'】')}
    const t=fmtTime(m.ts);
    if(m.type==='notice'){L.push('        —— '+m.text+' ——');continue}
    if(m.type==='invite'){L.push(t+'  '+c.name+'（私密邀请）：');
      String(m.text||'').split('\n').forEach(x=>L.push('        '+x));
      L.push('        ['+(m.state==='accepted'?'你接受了':'你没有回应')+']');continue}
    const who=m.from==='me'?(myName(id)):c.name;
    if(m.reply)L.push('        ┌ 引用：'+String(m.reply).replace(/\n/g,' '));
    const body=m.type==='image'?'[照片] '+(m.text||'')
      :m.type==='voice'?'[语音 '+(m.dur||0)+'"] '+(m.text||'')
      :m.type==='sticker'?'[表情]':String(m.text||'');
    L.push(t+'  '+who+'：'+body);
  }
  return L.join('\n');
}
const stamp=()=>new Date().toISOString().slice(0,10);
function exportRoom(id){
  const c=getChar(id)||{name:'bubble'};
  closeAll();
  openSheet(`<div class="sh-title">导出和 ${esc(c.name)} 的泡泡记录</div>
    <button class="sh-item" id="ex1-txt"><svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M9 13h6M9 17h4"/></svg>文字记录 .txt（直接就能看）</button>
    <button class="sh-item" id="ex1-json"><svg viewBox="0 0 24 24"><path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/><path d="M2 12h11l-3-3M10 15l3-3"/></svg>备份 .json（以后能导回来）</button>
    <button class="sh-item" onclick="closeAll()">取消</button>`);
  const safe=String(c.name).replace(/[\\/:*?"<>|]/g,'');
  $('#ex1-txt').onclick=()=>{closeAll();saveFile('bubble-'+safe+'-'+stamp()+'.txt',toText(id),'text/plain')};
  $('#ex1-json').onclick=()=>{closeAll();
    saveFile('bubble-'+safe+'-'+stamp()+'.json',JSON.stringify(packRooms([id]),null,1),'application/json')};
}
function importBackup(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d;try{d=JSON.parse(rd.result)}catch(e){return snack('这个文件读不了')}
      if(!d||d.app!=='bubble'||!Array.isArray(d.rooms))return snack('这不是 bubble 的备份文件');
      let ok=0,miss=[];
      for(const rr of d.rooms){
        if(!rr.charId)continue;
        if(!getChar(rr.charId)){miss.push(rr.charName||rr.charId);continue}
        const r=room(rr.charId);
        Object.assign(r,{msgs:rr.msgs||[],theme:rr.theme||r.theme,since:rr.since||r.since,
          sub:rr.sub!==false,rel:rr.rel||'fan',open:rr.open||'secret',know:rr.know||'auto',
          extra:rr.extra||'',auto:rr.auto!==false,unread:0,
          inviteState:rr.inviteState||'',inviteAtCount:rr.inviteAtCount||0});
        persist(rr.charId);ok++;
      }
      renderHome();openMy();
      snack(ok?`导入了 ${ok} 个房间`+(miss.length?`，${miss.length} 个找不到对应角色`:''):'没有能对上的角色');
    };
    rd.readAsText(f)};
  i.click();
}

/* ==================== 我的资料 ==================== */
async function loadProfile(){
  let rec=null;
  if(HOST){try{const l=await HOST.db.list('profile',{limit:1});rec=l&&l[0]}catch(e){}}
  else{try{rec=JSON.parse(LS.get('bubble_profile')||'null')}catch(e){}}
  if(!rec)return;
  profileId=rec.id||null;
  me.nick=rec.nick||'';
  me.real=rec.real||'';
  me.avatarRef=rec.avatarRef||'';
  if(rec.avatarSrc)me.avatar=rec.avatarSrc;
  else if(me.avatarRef){const u=await SDK.readImage(me.avatarRef);if(u)me.avatar=u}
}
let saveT=null;
function saveProfile(){
  clearTimeout(saveT);
  return new Promise(res=>{saveT=setTimeout(async()=>{
    const body={nick:me.nick||'',real:me.real||'',avatarRef:me.avatarRef||'',
      avatarSrc:me.avatarRef?'':(me.avatar||'')};
    if(HOST){
      try{
        if(profileId)await HOST.db.update('profile',profileId,body);
        else{const c=await HOST.db.create('profile',body);profileId=c&&c.id}
      }catch(e){}
    }else LS.set('bubble_profile',JSON.stringify(body));
    res();},250)});
}

/* ==================== boot ==================== */
async function loadChars(){
  chars=(await SDK.chars()).filter(c=>c&&c.id).map(c=>({...c,name:c.name||'未命名'}));
  chars.forEach((c,i)=>{const r=room(c.id);
    if(!r.theme)r.theme=THEMES[i%THEMES.length];
    if(!r.msgs.filter(m=>m.type!=='notice').length&&r.inviteState){
      r.inviteState='';r.inviteAtCount=0;r.inviteHistory=[];persist(c.id)}});
}
async function init(){
  const [ctx]=await Promise.all([SDK.host?SDK.launch():null]);
  const hp=await SDK.me();
  me.name=hp.name||'';me.hostAvatar=hp.avatar||'';
  await loadProfile();
  const saved=await SDK.listRooms();
  saved.forEach(r=>{if(r&&r.charId)rooms[r.charId]={
    charId:r.charId,msgs:r.msgs||[],unread:r.unread||0,theme:r.theme,auto:r.auto!==false,
    extra:r.extra||'',since:r.since||0,bgRef:r.bgRef||'',bgSrc:r.bgSrc||'',
    rel:r.rel||'fan',open:r.open||'secret',know:r.know||'auto',
    inviteState:r.inviteState||'',inviteAtCount:r.inviteAtCount||0,inviteHistory:r.inviteHistory||[],
    genImage:r.genImage!==false,autoTTS:!!r.autoTTS,
    sub:r.sub!==undefined?!!r.sub:((r.msgs||[]).length>0),_dbId:r.id};});
  await loadChars();
  await Promise.all(chars.slice(0,12).map(c=>loadPersonaName(c.id)));
  if(!me.name){const f=chars.map(c=>personaNames[c.id]).find(Boolean);if(f)me.name=f}
  await loadStickers();
  renderHome();
  $('#boot').classList.add('gone');
  const target=ctx&&ctx.characterId;
  if(target&&getChar(target))openChat(target);
  else if(!SDK.host)snack('预览模式：装进小手机后 TA 才会真的回你');
}
init();
