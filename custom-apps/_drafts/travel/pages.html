<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaiscreen.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 20px;background:#d9dadd;display:grid;grid-template-columns:repeat(4,375px);gap:22px;font-family:-apple-system,"PingFang SC",sans-serif;color:#1f1f1f}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.lab{font-size:19px;font-weight:800;color:#333;text-align:center}.lab small{display:block;font-size:12.5px;color:#777;font-weight:600;margin-top:3px}
.ph{width:375px;height:800px;border-radius:36px;overflow:hidden;position:relative;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.status{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:700;z-index:900}
.cap{position:absolute;right:8px;top:50px;width:84px;height:30px;border-radius:15px;background:rgba(255,255,255,.88);box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:950;display:flex;align-items:center;justify-content:space-around;font-size:13px;color:#333}
.top{position:absolute;left:0;right:104px;top:48px;height:36px;display:flex;align-items:center;gap:6px;padding-left:10px;z-index:900}
.top svg{width:24px;height:24px}
.top b{font-size:18px}
.leaflet-control-attribution{display:none}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;z-index:900;background:#fff;display:flex;justify-content:space-around;padding-top:10px;font-size:11.5px;border-top:1px solid #eee}
.nav div{text-align:center;color:#666}.nav i{display:block;width:24px;height:24px;margin:0 auto 3px}.nav svg{width:24px;height:24px}
.nav .on{color:#111;font-weight:700}.nav .on svg{stroke-width:2.3}
/* 地图页 */
.trip-chip{position:absolute;left:12px;top:92px;z-index:900;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px}
.trip-chip .av2{display:flex}.trip-chip .av2 i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:block}.trip-chip .av2 i+i{margin-left:-8px}
.trip-chip b{font-size:15px;display:block}.trip-chip small{font-size:11.5px;color:#888}
.pin{position:relative;width:46px;height:46px}
.pin .c{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.pin .n{position:absolute;left:-4px;top:-6px;background:#3b7cff;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;border:2px solid #fff}
.pin .lb{position:absolute;top:50px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pin.plan .c{border-style:dashed;border-color:#3b7cff;background:#fff!important;display:grid;place-items:center;color:#3b7cff;font-size:20px;font-weight:300}
.sheet{position:absolute;left:0;right:0;bottom:80px;z-index:900;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px 14px;box-shadow:0 -4px 20px rgba(0,0,0,.12)}
.sheet .h{width:36px;height:4px;border-radius:2px;background:#ccc;margin:0 auto 10px}
.days{display:flex;gap:8px;overflow:hidden}
.days span{flex:none;padding:6px 12px;border-radius:14px;background:#f1f4f9;font-size:13px;font-weight:600;color:#555}.days span.on{background:#111;color:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:#777;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
/* 地点详情 */
.hero{height:330px;position:relative}
.hero .img{position:absolute;inset:0;background:linear-gradient(180deg,#9aa9b8 0%,#5f6d7a 45%,#2b2f35 70%,#15171a 100%)}
.hero .img:after{content:"";position:absolute;left:0;right:0;bottom:60px;height:60px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.5) 0 2px,transparent 2px 9px);opacity:.35;filter:blur(1px)}
.hero .dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.hero .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}.hero .dots i:first-child{background:#fff;width:16px;border-radius:3px}
.hero .cnt{position:absolute;right:14px;bottom:12px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;border-radius:10px;padding:2px 8px}
.pd{padding:16px 18px}
.pd h2{margin:0;font-size:24px}.pd .sub{font-size:13px;color:#888;margin-top:4px;display:flex;align-items:center;gap:6px}
.with{display:inline-flex;align-items:center;gap:6px;background:#eef3ff;color:#3b7cff;font-size:12px;font-weight:700;border-radius:12px;padding:3px 10px 3px 3px;margin-top:10px}.with i{width:20px;height:20px;border-radius:50%;background:#7a8fb8}
.note{margin-top:14px;display:flex;gap:10px}
.note .a{width:32px;height:32px;border-radius:50%;flex:none}
.note .bub{flex:1;background:#f5f6f8;border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.65}
.note .bub small{display:block;font-size:11.5px;color:#999;margin-bottom:3px}
.note.his .bub{background:#fff7e8}
.acts{display:flex;gap:10px;margin-top:16px}
.acts div{flex:1;border:1px solid #ddd;border-radius:14px;padding:10px 0;text-align:center;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}.acts svg{width:18px;height:18px}
/* 攻略 */
.gl{position:absolute;inset:88px 0 80px;overflow:hidden;padding:0 16px}
.gl-hd{background:linear-gradient(135deg,#dbe8ff,#f3e8ff);border-radius:18px;padding:14px 16px}
.gl-hd b{font-size:20px;display:block}.gl-hd small{font-size:12.5px;color:#666}
.gl-hd .by{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:#555}.gl-hd .by i{width:22px;height:22px;border-radius:50%;background:#7a8fb8}
.day{margin-top:14px}
.day h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}.day h4 span{background:#111;color:#fff;font-size:11px;border-radius:8px;padding:2px 7px}
.it{display:flex;gap:10px;position:relative;padding-bottom:12px}
.it:before{content:"";position:absolute;left:23px;top:22px;bottom:0;width:2px;background:#e5e8ee}
.it:last-child:before{display:none}
.it time{width:46px;flex:none;font-size:12.5px;color:#888;padding-top:2px;text-align:right;padding-right:8px;position:relative;z-index:1;background:#fff}
.it .b{flex:1}.it .b b{font-size:14.5px;display:block}.it .b p{margin:2px 0 0;font-size:12.5px;color:#777;line-height:1.5}
.it .hand{font-family:"LXGW WenKai Screen","Kaiti SC",serif;color:#c2554a;font-size:14px;margin-top:4px}
/* 票 */
.tk{position:absolute;inset:88px 0 80px;overflow:hidden;padding:0 16px;background:#f3f4f7}
.bp{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);position:relative}
.bp-hd{background:#1d3f7a;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.bp-hd b{font-size:14px;letter-spacing:1px}
.bp-main{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.bp-main .city b{font-size:30px;font-weight:800;letter-spacing:1px;display:block}.bp-main .city small{font-size:12px;color:#888}
.bp-main .mid{text-align:center;color:#999;font-size:11.5px}.bp-main .mid svg{width:26px;height:26px;color:#1d3f7a;margin:0 auto}
.bp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 12px;font-size:11px;color:#999}.bp-grid b{display:block;font-size:15px;color:#111;margin-top:2px}
.bp-cut{border-top:2px dashed #e3e5ea;margin:0 12px;position:relative}
.bp-cut:before,.bp-cut:after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:#f3f4f7}.bp-cut:before{left:-22px}.bp-cut:after{right:-22px}
.bp-ft{display:flex;align-items:center;gap:12px;padding:10px 16px 12px}
.bar{flex:1;height:34px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px,#111 8px 11px,transparent 11px 12px)}
.bp-ft small{font-size:11px;color:#888}
.bp.back{position:absolute;left:24px;right:24px;top:-8px;height:40px;background:#e8ecf4;box-shadow:none;z-index:-1}
.two{position:relative;margin-top:40px}
.tag2{position:absolute;right:12px;top:-30px;background:#ffe2e8;color:#d64b5d;font-size:11.5px;font-weight:700;border-radius:10px;padding:2px 8px}
.rail{margin-top:18px;background:linear-gradient(135deg,#a9d2f2,#7fb6e3);border-radius:10px;padding:12px 16px 10px;color:#123;font-family:"Songti SC","STSong",serif;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.1);overflow:hidden}
.rail:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 6px,transparent 6px 12px)}
.rail>*{position:relative}
.rail .no{display:flex;justify-content:space-between;font-size:12px;color:#c0392b;font-family:Menlo,monospace}
.rail .st{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.rail .st b{font-size:22px;letter-spacing:4px}.rail .st small{display:block;font-size:10px;letter-spacing:1px;font-family:Arial;color:#345}
.rail .tr{text-align:center;font-size:15px;font-weight:700}.rail .tr i{display:block;font-style:normal;font-size:10px;letter-spacing:2px}
.rail .info{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
.rail .name{font-size:12px;margin-top:6px;color:#234;display:flex;justify-content:space-between}
</style></head><body>
<script>
const NAVI={"足迹":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></svg>',"攻略":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3.5h9l3 3v14H6z"/><path d="M9 10h6M9 14h6M9 18h3.5"/></svg>',"订票":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7.5h17v3a2 2 0 0 0 0 3v3h-17v-3a2 2 0 0 0 0-3z"/><path d="M14.5 7.5v9" stroke-dasharray="1.6 2"/></svg>',"航班":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10.5 13.5 4 11l1.5-1.5 7 1L17 6c1-1 2.6-1.2 3-.8.4.4.2 2-.8 3L14.5 12.5l1 7L14 21l-2.5-6.5L8 18v2.5L6.5 22 5 19l-3-1.5L3.5 16H6l3.5-3.5"/></svg>',"票根夹":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 6.5h6l2 2h9v11h-17z"/><path d="M3.5 10.5h17"/></svg>'};
const nav=on=>`<div class="nav">${Object.entries(NAVI).map(([k,v])=>`<div class="${k===on?'on':''}"><i>${v}</i>${k}</div>`).join("")}</div>`;
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>';
const head=(t)=>`<div class="status">9:41<span>●●● ▮</span></div><div class="cap">··· | ○</div><div class="top">${BACK}<b>${t}</b></div>`;
const IC={img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>',pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',plane:NAVI["航班"],pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>'};
document.write(`
<div class="col"><div class="lab">① 国外：冰岛<small>出国自动换成世界地图</small></div><div class="ph">
 <div id="m" style="position:absolute;inset:0"></div>${head("")}
 <div class="trip-chip"><div class="av2"><i style="background:#c58af9"></i><i style="background:#7a8fb8"></i></div><div><b>冰岛 · 7 天</b><small>和沈砚 · 2026年1月</small></div></div>
 <div class="sheet"><div class="h"></div><div class="days"><span>全部</span><span class="on">第 1 天</span><span>第 2 天</span><span>第 3 天</span><span>第 4 天</span></div>
 <div class="legend"><span><i style="background:#3b7cff"></i>打过卡的</span><span><i style="border:2px dashed #3b7cff;background:#fff"></i>攻略里还没去的</span><span><i style="background:none;border-top:2px dashed #3b7cff;border-radius:0;height:0;width:16px"></i>路线</span></div></div>
 ${nav("足迹")}</div></div>

<div class="col"><div class="lab">② 点开一个地点<small>照片可以从相册选，也能生图</small></div><div class="ph">
 <div class="hero"><div class="img"></div><div class="dots"><i></i><i></i><i></i><i></i></div><div class="cnt">1 / 4</div></div>
 <div class="status" style="color:#fff">9:41<span>●●● ▮</span></div><div class="cap">··· | ○</div><div class="top" style="color:#fff">${BACK}</div>
 <div class="pd"><h2>黑沙滩</h2><div class="sub">${IC.pin.replace('<svg','<svg width="14" height="14"')}Reynisfjara · 冰岛　·　1月14日 15:20</div>
 <div class="with"><i></i>和沈砚一起</div>
 <div class="note"><div class="a" style="background:#c58af9"></div><div class="bub"><small>我</small>风大到站不稳，浪一下冲到脚边，他拽着我往后跑，鞋还是湿了。</div></div>
 <div class="note his"><div class="a" style="background:#7a8fb8"></div><div class="bub"><small>沈砚</small>那天你冻得直跺脚还非要拍玄武岩。下次来夏天来，我还拽你。</div></div>
 <div class="acts"><div>${IC.img}加照片</div><div>${IC.spark}生一张</div><div>${IC.pen}写一句</div></div></div>
 </div></div>

<div class="col"><div class="lab">③ 他写的攻略<small>每个点都能一键插到地图上</small></div><div class="ph">
 ${head("攻略")}<div class="gl"><div class="gl-hd"><b>冰岛环岛 7 天</b><small>1月12日 - 1月18日 · 南线为主</small><div class="by"><i></i>沈砚写的 · 你改过 2 处</div></div>
 <div class="day"><h4><span>第 1 天</span>雷克雅未克</h4>
  <div class="it"><time>14:30</time><div class="b"><b>凯夫拉维克机场落地</b><p>取车，先去超市买三明治和热饮</p></div></div>
  <div class="it"><time>17:00</time><div class="b"><b>哈尔格林姆斯教堂</b><p>上塔看城市，傍晚灯亮了最好看</p><div class="hand">你肯定要在门口拍二十张</div></div></div>
  <div class="it"><time>19:30</time><div class="b"><b>吃热狗</b><p>Bæjarins Beztu，排队也就十分钟</p></div></div></div>
 <div class="day"><h4><span>第 2 天</span>南岸</h4>
  <div class="it"><time>09:00</time><div class="b"><b>塞里雅兰瀑布</b><p>可以走到瀑布后面，带雨衣</p><div class="hand">雨衣我带两件</div></div></div>
  <div class="it"><time>13:00</time><div class="b"><b>黑沙滩</b><p>离海远一点，浪很突然</p></div></div></div>
 </div>${nav("攻略")}</div></div>

<div class="col"><div class="lab">④ 登机牌 + 火车票<small>一起去的两张叠在一起</small></div><div class="ph">
 ${head("我的票")}<div class="tk">
 <div class="two"><div class="bp back"></div><div class="bp"><div class="bp-hd"><b>中国国际航空</b><span>CA 851 · 经济舱</span></div>
  <div class="bp-main"><div class="city"><b>PEK</b><small>北京首都 T3</small></div><div class="mid">${IC.plane}<div>13h 25m</div></div><div class="city" style="text-align:right"><b>KEF</b><small>雷克雅未克</small></div></div>
  <div class="bp-grid"><div>日期<b>1月12日</b></div><div>登机<b>00:40</b></div><div>登机口<b>E17</b></div><div>座位<b>32A</b></div></div>
  <div class="bp-cut"></div><div class="bp-ft"><div><small>旅客</small><div style="font-weight:700">FLORA</div></div><div class="bar"></div></div></div>
  <div class="tag2">沈砚 32B · 挨着你</div></div>
 <div class="rail"><div class="no"><span>E 012345</span><span>上海虹桥站 售</span></div>
  <div class="st"><div><b>上海虹桥</b><small>Shanghaihongqiao</small></div><div class="tr">G7511<i>——————→</i></div><div style="text-align:right"><b>杭州东</b><small>Hangzhoudong</small></div></div>
  <div class="info"><span>2026年10月25日 08:12开</span><span>06车 12F号</span></div>
  <div class="info"><span>¥73.0元</span><span>二等座</span></div>
  <div class="name"><span>限乘当日当次车</span><span>Flora</span></div></div>
 </div>${nav("订票")}</div></div>`);
const m=L.map("m",{zoomControl:false,attributionControl:false}).setView([63.65,-19.4],6.1);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:18}).addTo(m);
const P=[["雷克雅未克",64.146,-21.94,"#9fc5f8","#5b8bd9",3,1],["塞里雅兰瀑布",63.615,-19.989,"#b7e4c7","#52b788",2,1],["黑沙滩",63.404,-19.045,"#9aa9b8","#2b2f35",4,1],["冰河湖",64.048,-16.18,"#bde0fe","#a2d2ff",0,0],["蓝湖",63.88,-22.449,"#a0e7e5","#4fb3bf",0,0]];
L.polyline(P.map(p=>[p[1],p[2]]).concat([[63.88,-22.449]]).slice(0,4),{color:"#3b7cff",weight:3,dashArray:"6 8"}).addTo(m);
for(const [n,la,lo,c1,c2,cnt,done] of P) L.marker([la,lo],{icon:L.divIcon({className:"",iconSize:[46,46],iconAnchor:[23,23],html:`<div class="pin ${done?'':'plan'}"><div class="c" style="background:linear-gradient(135deg,${c1},${c2})">${done?'':'+'}</div>${cnt?`<div class="n">${cnt}</div>`:''}<div class="lb">${n}</div></div>`})}).addTo(m);
</script></body></html>
