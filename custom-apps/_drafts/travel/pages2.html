<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 20px;background:#d9dadd;display:grid;grid-template-columns:repeat(5,375px);gap:22px;font-family:-apple-system,"PingFang SC",sans-serif;color:#1f1f1f}

.cols{display:grid;grid-template-columns:repeat(3,30px) 24px repeat(3,30px);gap:8px 7px;justify-content:center;font-size:11px;color:#999;text-align:center}

.seatTip{margin:14px 14px 0;background:#fff7e8;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6;display:flex;gap:10px}

.payBtn{position:absolute;left:14px;right:14px;bottom:92px;height:48px;border-radius:24px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:700;z-index:901}

.fcard{position:absolute;left:12px;right:12px;bottom:92px;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:900}

.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;font-size:11.5px;color:#888;text-align:center}.fgrid b{display:block;font-size:15px;color:#111}
.fbtns{display:flex;gap:8px;margin-top:12px}.fbtns div{flex:1;text-align:center;border-radius:14px;padding:10px 0;font-size:13.5px;font-weight:700;border:1px solid #ddd}.fbtns .p{background:#111;color:#fff;border-color:#111}
.ftop{position:absolute;left:12px;top:92px;z-index:900;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:13px}
