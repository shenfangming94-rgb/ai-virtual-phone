<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face { font-family: Px; src: url(pixel.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { background: #e9e6e1; display: flex; justify-content: center; padding: 22px 0; font-family: -apple-system, "PingFang SC", sans-serif; }
.phone { position: relative; width: 350px; height: 800px; border-radius: 46px 46px 60px 60px; padding: 30px 22px;
  background: linear-gradient(100deg, #b9bcbf 0%, #e9ebec 18%, #cfd2d4 45%, #f2f3f3 70%, #b6b9bc 100%);
  box-shadow: inset 0 3px 2px rgba(255,255,255,.9), inset 0 -6px 10px rgba(0,0,0,.18), 0 14px 30px rgba(0,0,0,.25); }
.speaker { width: 120px; height: 12px; margin: 0 auto; border-radius: 8px; background: linear-gradient(#222, #444); box-shadow: 0 1px 0 #fff; }
.brand { text-align: center; margin: 14px 0 12px; font: 900 26px/1 "Arial Black", Arial, sans-serif; letter-spacing: 2px; color: #3b3b3b; text-shadow: 0 1px 0 #fff; }
.screen { height: 330px; border-radius: 16px; padding: 14px 16px; background: #9fd36a; border: 5px solid #b5b8ba;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.35), 0 1px 0 #fff; font-family: Px; color: #1d2a12; -webkit-font-smoothing: none; display: flex; flex-direction: column;
  background-image: linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px); background-size: 3px 3px; }
.bar { display: flex; align-items: center; gap: 6px; }
.bar svg { height: 22px; }
.bar .bat { margin-left: auto; }
.msg { flex: 1; margin-top: 16px; font-size: 24px; line-height: 1.45; }
.msg p { margin: 0; }
.date { font-size: 18px; opacity: .8; }
.soft { display: flex; justify-content: space-between; font-size: 18px; margin-top: 6px; }
.row1 { display: flex; align-items: center; gap: 10px; margin: 20px 0 14px; }
.side { flex: 1; height: 92px; border-radius: 18px; background: #2b2d2f; box-shadow: inset 0 2px 1px #555, 0 2px 0 #9a9da0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.side div { flex: 1; display: flex; align-items: center; justify-content: center; }
.side div + div { border-top: 3px solid #1b1c1d; }
.side .dash { width: 36px; height: 4px; border-radius: 2px; background: #3aa0e8; }
.dpad { width: 108px; height: 78px; border-radius: 30px; background: linear-gradient(#eef0f1, #9ea2a5); padding: 9px; box-shadow: 0 2px 3px rgba(0,0,0,.3); }
.dpad div { width: 100%; height: 100%; border-radius: 22px; background: linear-gradient(#3a3c3e, #1f2021); box-shadow: inset 0 2px 1px #555; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 18px; overflow: hidden; background: #1b1c1d; gap: 3px; box-shadow: 0 2px 0 #9a9da0; }
.keys div { height: 54px; background: #2b2d2f; color: #eceeef; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 30px/1 Arial, sans-serif; box-shadow: inset 0 2px 1px #4a4c4e; position: relative; }
.keys small { font-size: 17px; letter-spacing: 1px; }
.foot { text-align: center; margin-top: 10px; font-size: 11px; color: #8a8d90; letter-spacing: 2px; }
.stk { position: absolute; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
</style></head><body>
<div class="phone">
  <div class="speaker"></div>
  <div class="brand">TINY TYPE</div>
  <div class="screen">
    <div class="bar">
      <svg viewBox="0 0 44 22" fill="#1d2a12"><path d="M0 0h12v3H8v3H4V3H0zM4 6h4v16H4z"/><rect x="15" y="15" width="4" height="7"/><rect x="21" y="11" width="4" height="11"/><rect x="27" y="7" width="4" height="15"/><rect x="33" y="3" width="4" height="19"/></svg>
      <svg viewBox="0 0 30 22" fill="none" stroke="#1d2a12" stroke-width="3"><rect x="2" y="2" width="26" height="18"/><path d="M2 2l13 10L28 2"/></svg>
      <svg class="bat" viewBox="0 0 44 22" fill="#1d2a12"><rect x="4" y="1" width="39" height="20" fill="none" stroke="#1d2a12" stroke-width="2.5"/><rect x="0" y="7" width="4" height="8"/><rect x="8" y="5" width="6" height="12"/><rect x="16" y="5" width="6" height="12"/><rect x="24" y="5" width="6" height="12"/><rect x="32" y="5" width="6" height="12"/></svg>
    </div>
    <div class="msg">
      <p>他：睡了吗</p><p>我：还没</p><p>他：下雪了 你那边呢</p><p>我：没有诶 拍给我看</p><p>他：拍不清 等你来</p>
    </div>
    <div class="date">2026/10/15 23:47</div>
    <div class="soft"><span>回复</span><span>返回</span></div>
  </div>
  <div class="row1">
    <div class="side"><div><i class="dash"></i></div><div><svg width="58" height="26" viewBox="0 0 40 18"><path d="M4 14c2-8 30-8 32 0l-6 1-1-4c-6-2-12-2-18 0l-1 4z" fill="#3c9a43"/></svg></div></div>
    <div class="dpad"><div></div></div>
    <div class="side"><div><i class="dash"></i></div><div><svg width="58" height="26" viewBox="0 0 40 18"><path d="M4 8c2 8 30 8 32 0l-6-1-1 4c-6 2-12 2-18 0l-1-4z" fill="#e2453a"/></svg></div></div>
  </div>
  <div class="keys">
    <div>1 <small>oo</small></div><div>2 <small>ABC</small></div><div><small>DEF</small> 3</div>
    <div>4 <small>GHI</small></div><div>5 <small>JKL</small></div><div><small>MNO</small> 6</div>
    <div>7 <small>PQRS</small></div><div>8 <small>TUV</small></div><div><small>WXYZ</small> 9</div>
    <div>* <small>+</small></div><div>0 <small>␣</small></div><div><small>⇧</small> #</div>
  </div>
  <div class="foot">TAP TO TYPE</div>
  <!-- 贴纸 -->
  <svg class="stk" style="right:6px;top:22px" width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="34" fill="#f7e04a" stroke="#fff" stroke-width="4"/><ellipse cx="27" cy="29" rx="3.5" ry="6" fill="#222"/><ellipse cx="47" cy="29" rx="3.5" ry="6" fill="#222"/><path d="M19 42c6 13 30 13 36 0" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/></svg>
  <svg class="stk" style="left:96px;top:468px" width="40" height="40" viewBox="0 0 36 36"><g transform="translate(18 18)" fill="#fff">
    <ellipse rx="5" ry="10" transform="rotate(0) translate(0 -9)"/><ellipse rx="5" ry="10" transform="rotate(60) translate(0 -9)"/><ellipse rx="5" ry="10" transform="rotate(120) translate(0 -9)"/><ellipse rx="5" ry="10" transform="rotate(180) translate(0 -9)"/><ellipse rx="5" ry="10" transform="rotate(240) translate(0 -9)"/><ellipse rx="5" ry="10" transform="rotate(300) translate(0 -9)"/><circle r="5.5" fill="#f2c230"/></g></svg>
  <svg class="stk" style="left:62px;top:662px" width="44" height="48" viewBox="0 0 44 48"><path d="M22 10c12-4 20 6 18 18-2 12-10 18-18 18S6 40 4 28C2 16 10 6 22 10z" fill="#e8463e" stroke="#fff" stroke-width="2.5"/><g fill="#f5d35a"><circle cx="14" cy="22" r="1.6"/><circle cx="24" cy="20" r="1.6"/><circle cx="31" cy="27" r="1.6"/><circle cx="18" cy="31" r="1.6"/><circle cx="27" cy="36" r="1.6"/></g><path d="M12 10c4-6 8-6 10-2 2-4 7-4 10 2-6 2-14 2-20 0z" fill="#5aa84a"/></svg>
  <svg class="stk" style="left:102px;top:668px" width="30" height="30" viewBox="0 0 30 30"><g transform="translate(15 15)" fill="#d86ad8" stroke="#fff" stroke-width="1.5"><circle cy="-7" r="6"/><circle cx="6.7" cy="-2.2" r="6"/><circle cx="4.1" cy="5.7" r="6"/><circle cx="-4.1" cy="5.7" r="6"/><circle cx="-6.7" cy="-2.2" r="6"/></g><circle cx="15" cy="15" r="3.5" fill="#f5d35a"/></svg>
  <svg class="stk" style="left:206px;top:586px" width="50" height="46" viewBox="0 0 50 46"><defs><radialGradient id="rb" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#ffd1e8"/><stop offset=".3" stop-color="#ffe066"/><stop offset=".55" stop-color="#7fd6a0"/><stop offset=".75" stop-color="#7cb7f0"/><stop offset="1" stop-color="#c38df0"/></radialGradient></defs><path d="M25 43C8 31 2 22 4 13 6 5 16 2 25 11 34 2 44 5 46 13c2 9-4 18-21 30z" fill="url(#rb)" stroke="#fff" stroke-width="4"/></svg>
  <svg class="stk" style="left:236px;top:712px" width="42" height="46" viewBox="0 0 42 46"><path d="M3 22C3 10 12 3 21 3s18 7 18 19z" fill="#d7372f" stroke="#fff" stroke-width="2.5"/><g fill="#fff"><circle cx="13" cy="13" r="3.5"/><circle cx="25" cy="10" r="3"/><circle cx="31" cy="18" r="2.5"/></g><path d="M15 22h12l-2 20h-8z" fill="#f4eee2" stroke="#fff" stroke-width="1"/></svg>
</div>
</body></html>
