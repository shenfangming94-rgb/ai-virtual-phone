.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 34px 0 40px;font-size:17px;font-weight:600;background:#fafafa}

.av{width:40px;height:40px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.nm{font-size:12px;color:#888;margin-bottom:4px}.nm b{background:#f5a623;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;margin-right:4px}

.card{width:272px;border-radius:16px;overflow:hidden;background:#111;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}

.card .k{font-size:10px;letter-spacing:3px;color:#b9a8ff}
.card .h{font-size:19px;font-weight:700;margin-top:4px;letter-spacing:1px}
.row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:.5px solid rgba(255,255,255,.08)}
.row .c{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.row .n{flex:1;font-size:14px}
.row .p{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.row .p span{font-size:11px;padding:2px 7px;border-radius:9px;background:rgba(255,255,255,.12)}
.row.me{background:rgba(185,168,255,.12)}
.row.me .p span{background:#b9a8ff;color:#16131f;font-weight:600}
.f{font-size:11px;color:#8a83a8;padding:8px 16px 12px}
