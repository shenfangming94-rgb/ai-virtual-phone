<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:430px;height:932px;background:#06050a;font-family:"PingFang SC","Hiragino Sans GB","Apple SD Gothic Neo",sans-serif;color:#fff;overflow:hidden;position:relative}
.glow{position:absolute;left:50%;top:40%;width:520px;height:520px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(185,168,255,.35) 0%,rgba(120,90,220,.12) 35%,rgba(0,0,0,0) 65%)}
.dust{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 70% 20%,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 80% 60%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 30% 75%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 55% 85%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 12% 55%,rgba(255,255,255,.4),transparent)}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 34px 0 40px;font-size:17px;font-weight:600;position:relative}
.top{position:relative;text-align:center;margin-top:120px;font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.55)}
.logo{position:relative;text-align:center;margin-top:40px;font-family:"Didot","Bodoni 72","Times New Roman",serif;font-size:66px;letter-spacing:14px;font-weight:400;padding-left:14px;text-shadow:0 0 30px rgba(185,168,255,.6)}
.kr{position:relative;text-align:center;margin-top:14px;font-size:18px;letter-spacing:10px;color:rgba(255,255,255,.85);padding-left:10px}
.line{position:relative;width:40px;height:1px;background:rgba(255,255,255,.4);margin:34px auto}
.mean{position:relative;text-align:center;font-size:15px;line-height:2;color:rgba(255,255,255,.8)}
.mean b{font-weight:600;color:#fff}
.who{position:relative;text-align:center;margin-top:60px;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,.5)}
.btn{position:absolute;left:40px;right:40px;bottom:70px;height:52px;border-radius:26px;background:rgba(255,255,255,.12);border:.5px solid rgba(255,255,255,.25);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;font-size:16px}
</style></head><body>
<div class="glow"></div><div class="dust"></div>
<div class="sb"><span>11:08</span><span>5G ▮</span></div>
<div class="top">2015 · 08 · 03 &nbsp; 7F 会议室</div>
<div class="logo">LUMINA</div>
<div class="kr">루미나</div>
<div class="line"></div>
<div class="mean">拉丁语里「光」的意思<br><b>「做彼此的光，也做别人的光」</b></div>
<div class="who">申多恩 · 李瑞妍 · Flora · 中村美咲 · 林夏琳</div>
<div class="btn">进入 LUMINA 群聊</div>
</body></html>
