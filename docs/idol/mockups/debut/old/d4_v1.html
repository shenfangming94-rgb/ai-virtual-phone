<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:430px;height:932px;font-family:"PingFang SC","Hiragino Sans GB","Apple SD Gothic Neo",-apple-system,sans-serif;color:#fff;overflow:hidden;position:relative;background:linear-gradient(160deg,#c9b8f0 0%,#8e7cc3 45%,#2d2450 100%)}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 34px 0 40px;font-size:17px;font-weight:600}
.date{text-align:center;margin-top:30px;font-size:20px;font-weight:600;opacity:.9}
.clock{text-align:center;font-size:104px;font-weight:600;letter-spacing:-2px;line-height:1;margin-top:2px;text-shadow:0 2px 20px rgba(0,0,0,.12)}
.wid{margin:34px 26px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w{border-radius:24px;background:rgba(255,255,255,.18);border:.5px solid rgba(255,255,255,.35);backdrop-filter:blur(30px);padding:14px 16px;height:150px;display:flex;flex-direction:column;justify-content:space-between}
.w .k{font-size:12px;letter-spacing:2px;opacity:.85}
.w .d{font-size:52px;font-weight:700;letter-spacing:-1px;line-height:1}
.w .s{font-size:13px;opacity:.9}
.w2 .row{font-size:13px;display:flex;gap:6px;align-items:baseline;opacity:.95}
.w2 .row{white-space:nowrap}.w2 .row b{font-size:12px;opacity:.7;width:38px;flex:none;font-weight:500}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.prog i{display:block;height:100%;width:62%;background:#fff;border-radius:3px}
.foot{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:14px;opacity:.75}
</style></head><body>
<div class="sb"><span></span><span>5G ▮</span></div>
<div class="date">8月7日 星期五</div>
<div class="clock">07:12</div>
<div class="wid">
 <div class="w"><div class="k">LUMINA 出道</div><div class="d">D-30</div><div class="prog"><i></i></div></div>
 <div class="w w2"><div class="k">今天</div>
  <div class="row"><b>09:00</b>出道曲录音</div>
  <div class="row"><b>14:00</b>MV 服装试穿</div>
  <div class="row"><b>19:00</b>舞蹈合练</div></div>
</div>
<div class="foot">↑ 向上轻扫解锁</div>
</body></html>
